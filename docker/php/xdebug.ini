; ─────────────────────────────────────────────────────────────────────────────
; Xdebug 3 configuration
;
; Mode is intentionally set to "off" by default — zero overhead for normal dev.
; Override via environment variable, e.g. in docker-compose.yml:
;
;   environment:
;     XDEBUG_MODE: debug          # step debugging (PhpStorm / VS Code)
;     XDEBUG_MODE: coverage       # code coverage for phpunit
;     XDEBUG_MODE: debug,coverage # both at once
; ─────────────────────────────────────────────────────────────────────────────

[xdebug]
xdebug.mode = ${XDEBUG_MODE:-off}

; Host where your IDE is listening.
; host.docker.internal resolves to the Docker host on Mac/Windows.
; On Linux set XDEBUG_CLIENT_HOST=172.17.0.1 (docker0 bridge IP) in .env
xdebug.client_host = ${XDEBUG_CLIENT_HOST:-host.docker.internal}
xdebug.client_port = ${XDEBUG_CLIENT_PORT:-9003}

; IDE key must match your IDE's server configuration
xdebug.idekey = ${XDEBUG_IDEKEY:-PHPSTORM}

; Start debugging automatically for every request (no trigger needed)
xdebug.start_with_request = yes

; Increase log verbosity only when troubleshooting the connection
; 0 = off, 7 = everything
xdebug.log_level = 0

; Limits for complex applications
xdebug.max_nesting_level = 512
